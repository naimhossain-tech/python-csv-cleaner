name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Compile Python files
        run: python -m py_compile clean_csv.py batch_clean.py test_clean_csv.py test_batch_clean.py

      - name: Run unit tests
        run: python -m unittest -v test_clean_csv test_batch_clean
